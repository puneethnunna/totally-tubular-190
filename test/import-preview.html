<!doctype html>
<html><head><meta charset="utf-8"><title>Import dialog preview</title>
<style>html,body{margin:0;height:100%;background:#0b0d11;color:#eae8e3;font:14px system-ui}#log{padding:16px;white-space:pre-wrap}button{padding:8px 14px;margin:16px 16px 0}</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}</script></head>
<body><button id="go">Open import dialog</button> <button id="grid">Roster previews</button><div id="log"></div><div id="cards" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:16px"></div>
<script type="module">
import { openImportDialog } from '../js/importDialog.js';
import { listRobots } from '../js/robots.js';
import { createRobotPreview } from '../js/preview3d.js';
const log = document.getElementById('log');
document.getElementById('go').onclick = async () => {
  const d = await openImportDialog(document.body);
  log.textContent = d ? 'Saved: ' + JSON.stringify(d, null, 1) : 'Cancelled';
};
document.getElementById('grid').onclick = async () => {
  const cards = document.getElementById('cards'); cards.innerHTML = '';
  (await listRobots()).forEach((r, i) => {
    const c = document.createElement('div'); c.style.cssText = 'height:180px;background:#161616;border-radius:8px;position:relative';
    const l = document.createElement('div'); l.textContent = r.number + ' ' + r.name; l.style.cssText = 'position:absolute;left:8px;bottom:6px;z-index:2';
    cards.appendChild(c); c.appendChild(l);
    createRobotPreview(c).show(r, i % 2 ? 'red' : 'blue');
  });
};
if (location.hash === '#grid') document.getElementById('grid').click();
if (location.hash === '#dialog') document.getElementById('go').click();
</script></body></html>
